<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>On the Docket — Zoeb Izzi</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .proj-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 20px;
    }
    .proj-card-top {
      display: flex; justify-content: space-between;
      align-items: flex-start; flex-wrap: wrap; gap: 14px; margin-bottom: 18px;
    }
    .proj-title {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 1.35rem; letter-spacing: -0.02em; margin-top: 8px;
    }
    .proj-desc {
      color: var(--text-muted); font-size: 0.95rem; line-height: 1.7;
      max-width: 640px; margin-bottom: 18px;
    }
    .proj-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .proj-status {
      padding: 16px; background: var(--bg);
      border-radius: 8px; border: 1px solid var(--border);
    }
    .proj-status-label {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: #C2410C; margin-bottom: 6px;
    }
    .proj-status p { font-size: 0.88rem; color: var(--text-muted); }
    .tag-docket { background: #FFF7ED; color: #C2410C; }
    .tab-toggle { display: flex; gap: 8px; margin-bottom: 40px; }
  </style>
</head>
<body>

  <canvas id="game-canvas" aria-hidden="true"></canvas>

      </div>

      <div class="tab-toggle">
        <a class="btn btn-ghost"   href="projects-progress.html">🔨 In Progress</a>
        <a class="btn btn-primary" href="projects-docket.html">📋 On the Docket</a>
      </div>
