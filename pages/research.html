<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research — Zoeb Izzi</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .research-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px 32px;
      margin-bottom: 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .research-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); }
    .research-card-top {
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 16px; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .research-title {
      font-family: 'Syne', sans-serif; font-weight: 700;
      font-size: 1.05rem; color: var(--text);
    }
    .research-org {
      font-size: 0.82rem; color: var(--text-muted); margin-top: 4px;
      display: flex; align-items: center; gap: 6px;
    }
    .research-dates {
      font-size: 0.78rem; font-weight: 600; color: var(--accent);
      background: var(--accent-soft); padding: 4px 10px;
      border-radius: 20px; white-space: nowrap;
    }
    .research-desc { font-size: 0.92rem; color: var(--text-muted); line-height: 1.7; margin-bottom: 16px; }
    .research-links { display: flex; gap: 10px; flex-wrap: wrap; }
    .research-link {
      font-size: 0.8rem; font-weight: 600; color: var(--accent);
      text-decoration: none; display: flex; align-items: center; gap: 5px;
      padding: 5px 12px; border: 1px solid var(--border-hover);
      border-radius: 8px; transition: background 0.18s;
    }
    .research-link:hover { background: var(--accent-soft); }

    .section-break {
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text-muted);
      margin: 44px 0 22px; padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <canvas id="game-canvas" aria-hidden="true"></canvas>
