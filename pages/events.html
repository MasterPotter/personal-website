<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upcoming Events — Zoeb Izzi</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .event-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 32px;
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 24px;
      align-items: start;
      margin-bottom: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .event-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); }
    .event-date-box {
      background: var(--accent-soft);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
    }
    .event-month {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--accent);
    }
    .event-day {
      font-family: 'Syne', sans-serif; font-size: 1.8rem;
      font-weight: 800; color: var(--text); line-height: 1;
    }
    .event-year {
      font-size: 0.72rem; color: var(--text-muted); margin-top: 2px;
    }
    .event-name {
      font-family: 'Syne', sans-serif; font-weight: 700;
      font-size: 1.05rem; margin-bottom: 6px; color: var(--text);
    }
    .event-location {
      font-size: 0.82rem; color: var(--text-muted);
      margin-bottom: 8px; display: flex; align-items: center; gap: 5px;
    }
    .event-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; }
    .event-badge {
      display: inline-flex; align-items: center;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 5px 10px;
      border-radius: 20px; white-space: nowrap;
    }
    .badge-upcoming { background: var(--accent-soft); color: var(--accent); }
    .badge-past     { background: #F1F5F9; color: #94A3B8; }
    .badge-tbd      { background: #FFF7ED; color: #C2410C; }

    .events-divider {
      display: flex; align-items: center; gap: 16px;
      margin: 40px 0 28px; color: var(--text-muted); font-size: 0.8rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .events-divider::before, .events-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    @media (max-width: 640px) {
      .event-card { grid-template-columns: 72px 1fr; }
      .event-badge { display: none; }
    }
  </style>
</head>
