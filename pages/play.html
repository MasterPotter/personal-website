<!DOCTYPE html>
<html lang="en" data-root="..">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play, Zoeb Izzi</title>
  <meta name="description" content="A little Geometry Dash-style game, the easter egg from an earlier version of this site." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="../css/style.css?v=8" />
  <style>
    /* The original game looks for #game-canvas. Show it full-screen and playable. */
    #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 1; }
    .play-intro { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: var(--space-8) var(--gutter); text-align: center; pointer-events: none; }
    .play-intro .btn { pointer-events: auto; }
  </style>
</head>
<body class="play">

  <canvas id="game-canvas" aria-label="Geometry Dash-style game"></canvas>
  <div id="nav-container"></div>

  <div class="page-wrapper">
    <section class="play-intro">
      <div class="section-label" style="justify-content:center;">Easter egg</div>
      <h1 class="section-title" style="margin:12px 0 14px;">A little game</h1>
      <p class="section-sub" style="margin:0 auto;">This is the Geometry Dash-style game from an earlier version of the site, I couldn't bring myself to delete it. <strong>Space, click, or tap to jump.</strong> The shape cycles through a few modes on its own. Toggle it with the button in the corner.</p>
      <div style="margin-top: 22px;">
        <a class="btn btn-ghost" href="../index.html">← Back home</a>
      </div>
    </section>
  </div>

  <div id="footer-container"></div>
  <script src="../js/partials.js?v=8"></script>
  <script src="../js/site.js?v=8"></script>
  <script src="../js/musicbox.js?v=8"></script>
  <script src="../js/game.js?v=8"></script>
</body>
</html>
