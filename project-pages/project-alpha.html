<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Alpha — Zoeb Izzi</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .project-hero { padding: 60px max(24px, 7vw) 48px; max-width: 820px; margin: 0 auto; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      text-decoration: none; color: var(--text-muted);
      font-size: 0.85rem; font-weight: 500; margin-bottom: 32px;
      transition: color 0.18s;
    }
    .back-link:hover { color: var(--accent); }
    .project-eyebrow { margin-bottom: 14px; }
    .project-hero h1 {
      font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: clamp(1.9rem, 4vw, 3.1rem); letter-spacing: -0.03em;
      line-height: 1.1; margin-bottom: 18px;
    }
    .project-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
    .project-summary {
      font-size: 1.08rem; color: var(--text-muted); line-height: 1.75;
      font-weight: 300; border-left: 3px solid var(--accent);
      padding-left: 18px; margin-bottom: 28px;
    }
    .project-links { display: flex; gap: 10px; flex-wrap: wrap; }

    /* Blog posts */
    .updates-section { max-width: 820px; margin: 0 auto; padding: 0 max(24px, 7vw) 80px; }
    .updates-header {
      font-family: 'Syne', sans-serif; font-weight: 700;
      font-size: 1.2rem; margin-bottom: 28px;
      padding-bottom: 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .updates-count {
      font-size: 0.78rem; font-weight: 600; color: var(--text-muted);
      letter-spacing: 0.06em;
    }
    .blog-post {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 32px 34px;
      margin-bottom: 18px; transition: border-color 0.2s;
    }
    .blog-post:hover { border-color: var(--border-hover); }
    .blog-post-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .blog-post-title {
      font-family: 'Syne', sans-serif; font-weight: 700;
      font-size: 1.1rem; color: var(--text);
    }
    .blog-post-date {
      font-size: 0.75rem; font-weight: 600; color: var(--text-muted);
      letter-spacing: 0.08em; text-transform: uppercase;
      background: var(--bg); padding: 4px 10px; border-radius: 6px;
    }
    .blog-post-body { font-size: 0.95rem; color: var(--text-muted); line-height: 1.75; }
    .blog-post-body p { margin-bottom: 14px; }
    .blog-post-body p:last-child { margin-bottom: 0; }
    .blog-post-body h4 {
      font-family: 'Syne', sans-serif; font-weight: 700;
      font-size: 0.92rem; color: var(--text); margin: 20px 0 8px;
    }
    .blog-post-body ul { padding-left: 20px; margin-bottom: 14px; }
    .blog-post-body li { margin-bottom: 5px; }

    /* Placeholder */
    .post-placeholder {
      border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 40px; text-align: center; color: var(--text-muted);
    }
    .post-placeholder .ph-icon { font-size: 2rem; margin-bottom: 12px; }
    .post-placeholder h3 {
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem;
      margin-bottom: 8px; color: var(--text);
    }
    .post-placeholder p { font-size: 0.88rem; line-height: 1.6; }
  </style>
</head>
<body>

  <canvas id="game-canvas" aria-hidden="true"></canvas>
  <div id="nav-container"></div>

    <div class="project-hero reveal">

        <div class="card-tag">🔨 Active</div>
      </div>
